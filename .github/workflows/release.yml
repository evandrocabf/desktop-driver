name: release

# Builds the binaries `install.sh` downloads, so that installing needs neither
# a Rust toolchain nor five minutes of compiling.
#
# Asset names are cargo target triples because that is what the installer
# derives from `uname`: desktop-<triple>.tar.gz, each with a .sha256 beside it
# that the installer verifies before it unpacks anything.
#
# Linux is musl and static on both architectures. A glibc build carries the
# glibc version of the machine that produced it — one built on a runner
# requires that runner's GLIBC_2.x and refuses to start on anything older,
# which for a downloaded binary is a failure the user cannot do anything about.

on:
  push:
    tags: ['v*']
  # Buildable without tagging, to check the matrix still works. Nothing is
  # uploaded on this path: there is no release to attach it to.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: tag must match the Cargo package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Not the toolchain action's `targets:` input: that adds the target to
      # the toolchain the action installed, while `rust-toolchain.toml` pins
      # the one cargo actually uses, and the build then cannot find `core`.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: a Linux binary must really be static
        if: endsWith(matrix.target, '-musl')
        run: file target/${{ matrix.target }}/release/desktop | grep -q static

      # The binary answers before it is published. A release asset that cannot
      # run on the platform it is named for is worse than a missing one: the
      # installer would place it on the PATH and every later command would fail.
      - name: it runs on the platform it is built for
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          ./target/${{ matrix.target }}/release/desktop --version
          ./target/${{ matrix.target }}/release/desktop info --json

      - name: package
        run: |
          set -eu
          dir="target/${{ matrix.target }}/release"
          tar -czf "desktop-${{ matrix.target }}.tar.gz" -C "$dir" desktop
          if command -v sha256sum >/dev/null; then
            sha256sum "desktop-${{ matrix.target }}.tar.gz" \
              >"desktop-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "desktop-${{ matrix.target }}.tar.gz" \
              >"desktop-${{ matrix.target }}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop-${{ matrix.target }}.tar.gz
            desktop-${{ matrix.target }}.tar.gz.sha256

  # One release created after every target has built, rather than four jobs
  # racing to create it. A half-populated release is the state `install.sh`
  # cannot distinguish from a complete one: it asks for its own platform's
  # asset and gets a 404 that reads as "no release for you".
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -l assets
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            assets/*
