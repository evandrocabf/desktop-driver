name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Everything that does not need a desktop. Runs on any platform, so a
  # regression in the shared core is caught before either backend is built.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: an existing tarball installation updates without losing browser profiles
        run: |
          cargo build --release -p desktop-cli
          scripts/installer-update-smoke.sh
      # The same suite again with a display named, which is the state of a
      # developer's machine and not of this runner. A unit test that reads the
      # environment passes in one and fails in the other, and this job has
      # already been green while `cargo test` was broken for everyone with a
      # desktop. No X server is started: nothing here should be looking.
      - name: tests do not depend on there being a display
        run: DISPLAY=:99 cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: architecture gates
        run: cargo xtask architecture
      # Comments are rustdoc, so the docs are part of the build rather than an
      # afterthought — a broken link is a broken document.
      - run: cargo doc --workspace --no-deps

  # macOS is the platform that cannot be tested from a Linux workstation, so
  # this job is the only thing standing between "compiles in theory" and
  # "compiles". It builds the real binary and runs the platform-free tests.
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - name: binary declares the supported deployment floor
        run: vtool -show-build ./target/debug/desktop | grep -Eq 'minos 14([.]0+)?$'
      # Runs without any TCC grant, which is exactly the state a fresh machine
      # is in: these three must explain themselves rather than fail.
      - name: describe-only commands work unprivileged
        run: |
          ./target/debug/desktop info --json
          ./target/debug/desktop capabilities --json
          ./target/debug/desktop doctor --json
      - name: sessions are refused honestly rather than half-implemented
        run: |
          set -e
          ./target/debug/desktop session status | tee /tmp/status.txt
          grep -q "cannot give the agent a display" /tmp/status.txt
          if ./target/debug/desktop session start; then
            echo "session start should have failed on macOS"; exit 1
          fi
      - name: browser-native automation works on macOS
        run: |
          set -eu
          D=./target/debug/desktop
          PROFILE="ci-${RUNNER_ARCH}"
          cleanup() { "$D" --json browser close --profile "$PROFILE" >/dev/null 2>&1 || true; }
          trap cleanup EXIT INT TERM
          "$D" --json browser doctor --profile "$PROFILE"
          "$D" --json browser open \
            "file://${GITHUB_WORKSPACE}/tests/fixtures/browser/macos-smoke.html" \
            --headless --profile "$PROFILE"
          "$D" --json browser wait --load domcontentloaded --timeout 10000 --profile "$PROFILE"
          "$D" --json browser snapshot --interactive --profile "$PROFILE"
          "$D" --json browser fill 'css=input' 'macOS browser ✓' --profile "$PROFILE"
          "$D" --json browser click 'css=button' --profile "$PROFILE"
          "$D" --json browser wait --text 'macOS browser ✓' --timeout 10000 --profile "$PROFILE"
          "$D" --json browser get text 'css=output' --profile "$PROFILE" | tee /tmp/browser-get.json
          grep -Fq 'macOS browser ✓' /tmp/browser-get.json

  # The agent-session path end to end, in a container with no desktop at all.
  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install the packages doctor names
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq at-spi2-core xvfb openbox dbus-bin zenity
      - run: cargo build --release
      - name: start a display, drive an application, capture it
        run: |
          set -e
          D=./target/release/desktop
          $D doctor
          # Sessions are visible by default. A runner has no desktop to show one
          # on, so this must fall back to headless and say why rather than fail.
          $D session start --size 800x600 | tee /tmp/start.txt
          grep -q "cannot watch it" /tmp/start.txt
          $D session run zenity --info --text="ci probe"
          # Polled rather than slept: how long a GTK application takes to
          # reach the accessibility bus varies by an order of magnitude with
          # how loaded the machine is, and a fixed wait turns that into a
          # flake that looks like a broken tool.
          for _ in $(seq 1 30); do
            if $D apps | grep -q zenity; then break; fi
            sleep 2
          done
          $D apps | grep -q zenity
          for _ in $(seq 1 15); do
            if $D snapshot | grep -q "ci probe"; then break; fi
            sleep 2
          done
          $D snapshot | grep -q "ci probe"
          $D screenshot --output /tmp/shot.png
          test -s /tmp/shot.png
          $D session stop

  # A single file that runs on any distribution regardless of its glibc.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not the action's `targets:` input: that adds the target to the
      # toolchain the action installed, while `rust-toolchain.toml` pins the
      # one cargo actually uses. The target landed on stable and the build ran
      # on 1.97.1, which then could not find `core` for it. Run inside the
      # checkout so rustup reads the pin.
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: it must really be static
        run: |
          file target/x86_64-unknown-linux-musl/release/desktop | grep -q static
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/desktop
